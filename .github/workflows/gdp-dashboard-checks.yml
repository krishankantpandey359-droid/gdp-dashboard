name: GDP dashboard checks

on:
  push:
    branches: [main, "audit/gdp-dashboard-ci"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Run GDP loader tests
        run: python -m pytest -q
      - name: Compile application
        run: python -m py_compile streamlit_app.py src/gdp_data.py
      - name: Validate GDP dataset and year coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          path = Path("data/gdp_data.csv")
          assert path.is_file(), "GDP dataset is missing"
          df = pd.read_csv(path)
          required = {"Country Code", "Country Name"}
          missing = required - set(df.columns)
          assert not missing, f"Missing required columns: {sorted(missing)}"
          expected_years = {str(year) for year in range(1960, 2023)}
          missing_years = expected_years - set(df.columns)
          assert not missing_years, f"Missing GDP year columns: {sorted(missing_years)}"
          assert not df.empty, "GDP dataset is empty"
          assert df["Country Code"].notna().any(), "Country codes are all missing"
          print(f"Validated {len(df)} rows and {len(expected_years)} annual GDP columns.")
          PY
