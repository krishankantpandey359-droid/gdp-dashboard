name: GDP dashboard checks

on:
  push:
    branches: [main, "audit/gdp-dashboard-validation", "audit/gdp-dashboard-ci"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile application
        run: python -m py_compile streamlit_app.py src/gdp_data.py
      - name: Run unit tests
        run: pytest -q
      - name: Validate bundled data
        run: python -c "from src.gdp_data import load_gdp_data; d=load_gdp_data('data/gdp_data.csv'); assert d['Country Name'].notna().all(); print(d.shape)"
      - name: Streamlit HTTP smoke test
        run: |
          streamlit run streamlit_app.py --server.headless true --server.port 8501 > streamlit.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8501/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat streamlit.log
          exit 1
